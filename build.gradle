plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        mcbraziers {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    // ./gradlew runDatagen writes recipes, loot tables, tags and names into src/main/generated
    configureDataGeneration {
        modId = "mcbraziers"
        // Model and blockstate providers use client classes
        client = true
    }
    // ./gradlew runGameTest starts a headless server that runs the game tests in src/gametest
    configureTests {
        createSourceSet = true
        modId = "mcbraziers-gametest"
        enableGameTests = true
        enableClientGameTests = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    testImplementation platform("org.junit:junit-bom:${project.junit_version}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}

processResources {
    def version = project.version
    inputs.property "version", version
    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    def archivesName = project.base.archivesName.get()
    inputs.property "archivesName", archivesName
    from("LICENSE") {
        rename { "${it}_${archivesName}" }
    }
}
