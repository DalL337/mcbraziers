archives_base_name=mcbraziers

# Fabric Properties (Minecraft 26.3 ships unobfuscated: no mappings)
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.18.4

# Fabric API
fabric_api_version=0.163.0+26.3

# Tests (dev-only)
junit_version=6.1.3
